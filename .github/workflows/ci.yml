name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history so hatch-vcs can compute a version from tags
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install sibling vexy-lines-py from workspace
        run: |
          uv pip install --system -e ../vexy-lines-py

      - name: Install vexy-lines-apy with test dependencies
        run: |
          uv pip install --system -e ".[ai]"
          uv pip install --system pytest pytest-cov

      - name: Run tests (socket mocked — no live app required)
        run: python -m pytest tests/ -q --tb=short
