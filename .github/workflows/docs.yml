# this_file: .github/workflows/docs.yml
name: Build Docs
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pages: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: bash build.sh --docs --strict
